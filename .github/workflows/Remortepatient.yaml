name: CI - Playwright Automation (Scheduled on rpm-preprod)

on:
  # 👇 Manual trigger (for testing)
  workflow_dispatch: {}

  # 👇 Automated schedules (UTC time)
  schedule:
    # ✅ Every day at 2:00 PM IST (8:30 AM UTC) → Sanity
    - cron: "30 8 * * *"
    # ✅ Every Friday at 6 PM IST (12:30 PM UTC) → Regression
    - cron: "30 12 * * 5"

jobs:
  # -----------------------
  # Daily Sanity Job
  # -----------------------
  sanity-job:
    if: github.event.schedule == '30 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Checkout rpm-preprod Branch
        uses: actions/checkout@v4
        with:
          ref: rpm-preprod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-html playwright openpyxl
          p
